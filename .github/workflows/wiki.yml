name: Publish reviewed wiki
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wiki-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Clone, verify drift, and publish reviewed pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          mkdir -p scratch
          git clone "https://github.com/$REPOSITORY.wiki.git" scratch/wiki
          cargo xtask wiki-sync scratch/wiki
          git -C scratch/wiki config user.name 'tergon-wiki'
          git -C scratch/wiki config user.email 'tergon-wiki@users.noreply.github.com'
          git -C scratch/wiki add --all
          if ! git -C scratch/wiki diff --cached --quiet; then
            git -C scratch/wiki commit -m "docs: publish reviewed wiki from $GITHUB_SHA"
            git -C scratch/wiki push
          fi
