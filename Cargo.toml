[workspace]
members = ["crates/tergon-math", "crates/tergon-engine", "crates/tergon-lab", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/tergon-lab"
publish = false

[workspace.dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = 0

[profile.test]
debug = 0
